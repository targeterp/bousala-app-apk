name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk bousala.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bousala-App-Debug-APK
          path: bousala.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "تطبيق بوصلة للأندرويد - الإصدار v1.0.0"
          body: |
            ## تحميل تطبيق بوصلة (Bousala) للأندرويد
            
            يمكنك تحميل ملف الـ APK وتثبيته مباشرة على هاتفك الأندرويد.
            
            - **اسم الملف:** `bousala.apk`
            - **التوافق:** أندرويد 7.0 (Nougat) فما فوق.
            - **التحديث الأخير:** بناء آلي رسمي عبر GitHub Actions.
          files: bousala.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
